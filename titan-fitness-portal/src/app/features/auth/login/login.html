<div class="login-container">
  <h1>Login</h1>

  <form (ngSubmit)="onLogin()">
    <div>
      <label for="email">Email</label>
      <input
        id="email"
        type="email"
        name="email"
        [(ngModel)]="email"
        required
      />
    </div>

    <div>
      <label for="password">Password</label>
      <input
        id="password"
        type="password"
        name="password"
        [(ngModel)]="password"
        required
      />
    </div>

    <button type="submit">Login</button>

    @if (errorMessage) {
      <p>{{ errorMessage }}</p>
    }
  </form>
</div>ng build
