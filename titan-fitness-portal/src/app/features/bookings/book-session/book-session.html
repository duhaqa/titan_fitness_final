<div class="booking-form-container card">
  <h2 class="form-title">Book a Class Session</h2>
  <p class="form-subtitle">Assign a gym member to an upcoming scheduled session.</p>

  <div *ngIf="successMessage" class="alert-success">
    ✓ {{ successMessage }}
  </div>

  <form (ngSubmit)="onSubmit()" #bookingForm="ngForm">
    <div class="form-group">
      <label for="memberSelect">Select Member *</label>
      <select
        id="memberSelect"
        [(ngModel)]="bookingData.memberId"
        name="memberId"
        required
      >
        <option value="" disabled selected>-- Choose Member --</option>
        <option *ngFor="let m of members" [value]="m.id">{{ m.name }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="classSelect">Select Class *</label>
      <select
        id="classSelect"
        [(ngModel)]="bookingData.classId"
        name="classId"
        required
      >
        <option value="" disabled selected>-- Choose Class --</option>
        <option *ngFor="let c of availableClasses" [value]="c.id">{{ c.title }}</option>
      </select>
    </div>

    <div class="form-group">
      <label for="bookingDate">Booking Date *</label>
      <input
        type="date"
        id="bookingDate"
        [(ngModel)]="bookingData.bookingDate"
        name="bookingDate"
        required
      />
    </div>

    <div class="form-group">
      <label for="notes">Notes (Optional)</label>
      <textarea
        id="notes"
        rows="3"
        [(ngModel)]="bookingData.notes"
        name="notes"
        placeholder="Add special notes or instructions..."
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="button" class="btn-cancel" (click)="resetForm()">Reset</button>
      <button type="submit" class="btn-submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Booking...' : 'Confirm Booking' }}
      </button>
    </div>
  </form>
</div>
